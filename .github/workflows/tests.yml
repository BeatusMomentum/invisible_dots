name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `gate` is the ONLY context the branch protection requires: it depends on every
# job, so its name never drifts when the matrix changes. Unlike its siblings it
# accepts nothing but success, because no job here is ever skipped on purpose:
# a skip would mean a job that did not run, which reads exactly like one that
# passed.
defaults:
  run:
    shell: bash

jobs:
  english:
    name: the repository is English
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The gate ships inside the pinned browser layer; its settings are read
      # from pyproject.toml ([tool.invisible.english]).
      - name: install the pinned package, which carries the gate
        run: |
          python -m pip install --upgrade pip
          pip install "invisible-playwright-mcp==0.70.2"
      - name: check the prose
        run: |
          python -m invisible_core.english --selftest
          python -m invisible_core.english

  claims:
    name: the README promises nothing it cannot support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the pinned package, which carries the gate
        run: |
          python -m pip install --upgrade pip
          pip install "invisible-playwright-mcp==0.70.2"
      - name: check the claims
        run: |
          python -m invisible_core.claims --selftest
          python -m invisible_core.claims

  node:
    name: typecheck, vitest and builds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # PostgreSQL runs on Linux only (service containers need a Linux runner).
      # Its suites print a banner and skip without DATABASE_URL; the Linux run
      # below refuses to count a run in which they skipped.
      - name: start PostgreSQL
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=test -p 127.0.0.1:55432:5432 postgres:18
          for i in $(seq 1 60); do docker exec pg pg_isready -U postgres -h 127.0.0.1 && break; sleep 1; done
          echo "DATABASE_URL=postgres://postgres:test@127.0.0.1:55432/postgres" >> "$GITHUB_ENV"
      - name: vitest
        run: |
          set -o pipefail
          npx vitest run --reporter=default --reporter=json --outputFile=vitest-report.json | tee vitest.txt
      # vitest's exit code cannot tell "everything passed" from "everything was
      # skipped": on Linux, where PostgreSQL and bash are present, nothing may skip.
      - name: refuse a Linux run with skipped tests
        if: runner.os == 'Linux'
        run: |
          node -e '
            const r = require("./vitest-report.json");
            const skipped = r.numPendingTests + r.numTodoTests;
            console.log(`${r.numPassedTests} passed, ${r.numFailedTests} failed, ${skipped} skipped`);
            if (skipped > 0 || r.numPassedTests === 0) process.exit(1);
          '
      - name: bundles
        run: |
          npm run build --workspace @invisible-dots/invisible-dots-agent
          npm run build --workspace @invisible-dots/api
          npm run build --workspace @invisible-dots/cli
      - name: web client
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build --workspace @invisible-dots/web

  go:
    name: dot-agentd (go vet, go test, static build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guest/dot-agentd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: guest/dot-agentd/go.mod
          cache-dependency-path: guest/dot-agentd/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test -count=1 ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/dot-agentd ./cmd/dot-agentd

  shell:
    name: shell scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in $(git ls-files '*.sh') .githooks/pre-push; do
            bash -n "$f" || exit 1
            echo "ok $f"
          done

  gate:
    needs: [english, claims, node, go, shell]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: refuse unless every job succeeded
        run: |
          echo "english: ${{ needs.english.result }}"
          echo "claims:  ${{ needs.claims.result }}"
          echo "node:    ${{ needs.node.result }}"
          echo "go:      ${{ needs.go.result }}"
          echo "shell:   ${{ needs.shell.result }}"
          for result in "${{ needs.english.result }}" "${{ needs.claims.result }}" "${{ needs.node.result }}" "${{ needs.go.result }}" "${{ needs.shell.result }}"; do
            if [ "$result" != "success" ]; then
              echo "a job did not succeed: $result"
              exit 1
            fi
          done
          echo "ok"
